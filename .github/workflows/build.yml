name: Github Actions
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby install "${{ github.event.repository.name }}/${{ github.event.repository.name }}.nimble"
          nimby sync "${{ github.event.repository.name }}/nimby.lock"
      - run: nim r tests/tests.nim
      - run: nim r -d:nimAllocStats tests/test_mailbox_allocations.nim
      - run: nim r tests/test_gota_events.nim
      - run: nim r -d:replayEvents tests/test_gota_controls.nim
      - run: nim r -d:replayEvents tests/test_gota_camps.nim
      - run: nim r tests/test_gota_phases.nim
      - run: nim r -d:replayEvents tests/test_gota_portals.nim
      - run: nim r -d:replayEvents tests/test_gota_potions.nim
      - run: nim r -d:replayEvents tests/test_gota_progression.nim
      - run: nim r -d:replayEvents tests/test_gota_drafts.nim
      - name: Generate and verify deterministic replays
        run: nim r tools/gen_replays.nim gota cta lvd heartleaf
      - name: Check replay extractor
        shell: bash
        run: >-
          nim r examples/gods_of_the_arena/tools/replay_extractor.nim
          tmp/replays/gota.replay > /dev/null
      - run: >-
          nim r -d:profileTracePath=tmp/profile-test.json -d:profileFrames=2
          tests/test_profiles.nim
      - run: >-
          nim r -d:mapProfileTracePath=tmp/map-profile-test.json -d:profileFrames=2
          tests/test_profiles.nim
      - run: nim r tests/test_gota_sim.nim -- --bot:examples/gods_of_the_arena/players/base.bas:10
      - run: nim r -d:headless tests/test_gota_training.nim
      - run: nim r -d:headless tests/test_recordings.nim --bot examples/call_to_adventure/players/base.bas:4
      - run: nim r -d:headless -d:recordGota tests/test_recordings.nim --bot examples/gods_of_the_arena/players/base.bas:10
      - run: nim r -d:headless -d:recordHlf tests/test_recordings.nim --bot examples/heartleaf/players/base.bas:9
      - run: nim r -d:headless -d:recordLvd tests/test_recordings.nim --bot examples/light_vs_dark/players/base.bas:2
