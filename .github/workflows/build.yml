name: Github Actions
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: treeform/setup-nim-action@v6
      - name: Install native HTTP library on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          vcpkg install curl:x64-windows
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install dependencies
        shell: bash
        run: |
          cd ..
          nimby create
          nimby install "${{ github.event.repository.name }}/${{ github.event.repository.name }}.nimble"
          nimby sync "${{ github.event.repository.name }}/nimby.lock"
      - name: Run release tests and all-game determinism
        run: nim r -d:release -d:bassyNativeStrict tests/all.nim
      - name: Test lockstep training API
        run: nim r -d:release -d:headless -d:bassyNativeStrict tests/test_gota_lockstep.nim
      - name: Check neural converters
        run: python tests/test_neural_converters.py
